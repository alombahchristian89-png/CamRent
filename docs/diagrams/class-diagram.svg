<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#000000">Class Diagram - CAMRENT</text>

  <rect x="70" y="90" width="360" height="320" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line x1="70" y1="135" x2="430" y2="135" stroke="#000000" stroke-width="2"/>
  <text x="250" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#000000">User</text>
  <text x="90" y="165" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ id: ObjectId</text>
  <text x="90" y="190" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ name: String</text>
  <text x="90" y="215" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ email: String</text>
  <text x="90" y="240" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ password: String</text>
  <text x="90" y="265" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ role: String</text>
  <text x="90" y="290" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ isVerified: Boolean</text>
  <text x="90" y="315" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ verificationStatus: String</text>
  <text x="90" y="340" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ isActive: Boolean</text>
  <text x="90" y="365" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ comparePassword()</text>
  <text x="90" y="390" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ toJSON()</text>

  <rect x="520" y="90" width="420" height="380" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line x1="520" y1="135" x2="940" y2="135" stroke="#000000" stroke-width="2"/>
  <text x="730" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#000000">Property</text>
  <text x="540" y="165" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ id: ObjectId</text>
  <text x="540" y="190" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ title: String</text>
  <text x="540" y="215" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ description: String</text>
  <text x="540" y="240" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ price: Number</text>
  <text x="540" y="265" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ location.city: String</text>
  <text x="540" y="290" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ location.address: String</text>
  <text x="540" y="315" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ propertyType: String</text>
  <text x="540" y="340" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ bedrooms: Number</text>
  <text x="540" y="365" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ bathrooms: Number</text>
  <text x="540" y="390" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ area: Number</text>
  <text x="540" y="415" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ landlord: User</text>
  <text x="540" y="440" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ availableFrom: Date</text>

  <rect x="1000" y="120" width="330" height="260" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line x1="1000" y1="165" x2="1330" y2="165" stroke="#000000" stroke-width="2"/>
  <text x="1165" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#000000">Inquiry</text>
  <text x="1020" y="195" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ id: ObjectId</text>
  <text x="1020" y="220" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ message: String</text>
  <text x="1020" y="245" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ status: String</text>
  <text x="1020" y="270" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ tenantId: User</text>
  <text x="1020" y="295" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ landlordId: User</text>
  <text x="1020" y="320" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ propertyId: Property</text>
  <text x="1020" y="345" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ landlordResponse: String</text>

  <rect x="950" y="500" width="280" height="180" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line x1="950" y1="545" x2="1230" y2="545" stroke="#000000" stroke-width="2"/>
  <text x="1090" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#000000">Favorite</text>
  <text x="970" y="575" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ id: ObjectId</text>
  <text x="970" y="600" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ userId: User</text>
  <text x="970" y="625" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ propertyId: Property</text>
  <text x="970" y="650" font-family="Arial, sans-serif" font-size="16" fill="#000000">+ createdAt: Date</text>

  <line x1="430" y1="230" x2="520" y2="230" stroke="#000000" stroke-width="2"/>
  <text x="475" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#000000">1 .. *</text>
  <text x="475" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#000000">landlord</text>

  <line x1="940" y1="245" x2="1000" y2="245" stroke="#000000" stroke-width="2"/>
  <text x="970" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#000000">1 .. *</text>
  <text x="970" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#000000">has</text>

  <line x1="320" y1="410" x2="950" y2="560" stroke="#000000" stroke-width="2"/>
  <text x="610" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#000000">User 1 .. * Favorite</text>

  <line x1="760" y1="470" x2="990" y2="500" stroke="#000000" stroke-width="2"/>
  <text x="885" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#000000">Property 1 .. * Favorite</text>

  <line x1="360" y1="330" x2="1000" y2="305" stroke="#000000" stroke-width="2"/>
  <text x="690" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#000000">User 1 .. * Inquiry</text>
</svg>
